# Integração contínua do TechJobs Finder.
#
# Três frentes em paralelo, porque falham por motivos diferentes:
#
#   backend   ./mvnw test          — inclui a integração com Testcontainers, que precisa de Docker
#   frontend  tsc + vite build     — tipo quebrado e build que só falha fora do dev server
#   imagens   docker compose build — Dockerfile que só quebra no build
#
# O runner do GitHub tem Docker e uma combinação de versão compatível com o Testcontainers
# 1.21.3 que o Spring Boot traz. Numa máquina com Docker Engine 29 os testes de integração nem
# sobem: o /info responde 400 e o Testcontainers desiste com "Could not find a valid Docker
# environment". Enquanto essa migração não acontece, o CI é o único lugar onde a suíte roda
# inteira.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Push seguido de push na mesma branch: o run antigo é cancelado, não faz fila.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: testes do backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          # 21, o mesmo alvo do backend/pom.xml e da imagem do Dockerfile.
          java-version: "21"
          distribution: temurin
          cache: maven

      # O mvnw é versionado como 100644 (no Windows não existe bit de execução). Sem isto o
      # passo seguinte morre em "Permission denied".
      - name: permissão de execução no wrapper
        run: chmod +x backend/mvnw

      - name: testes
        working-directory: backend
        run: ./mvnw -B test

      # Relatório mesmo quando a suíte falha: é aí que ele interessa.
      - name: relatórios do surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: build do frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: instalar dependências
        working-directory: frontend
        run: npm ci

      # `npm run lint` é `tsc --noEmit`: checagem de tipo sem gerar arquivo.
      - name: checagem de tipos
        working-directory: frontend
        run: npm run lint

      - name: build
        working-directory: frontend
        run: npm run build

  imagens:
    name: build das imagens
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # O compose marca POSTGRES_PASSWORD e RESUME_ENCRYPTION_KEY_V1 como obrigatórias (`:?`), e
      # a interpolação aborta sem elas mesmo em build, que não sobe container nenhum. Valores
      # descartáveis, só para o compose conseguir ler o arquivo — nada aqui vira credencial.
      - name: build das imagens do compose
        env:
          POSTGRES_PASSWORD: ci-build-apenas
          RESUME_ENCRYPTION_KEY_V1: Q0ktYnVpbGQtYXBlbmFzLW5hby11c2FyLWVtLXByb2Q=
        run: docker compose build
