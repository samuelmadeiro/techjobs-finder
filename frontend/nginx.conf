server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sem credenciais nem dados sensíveis no frontend; CSP restrita mesmo assim.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /health {
        access_log off;
        return 200 "ok\n";
    }

    # Os arquivos com hash no nome nunca mudam de conteúdo: cache longo é seguro.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer rota conhecida pelo React (inclusive /perfil) devolve o index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A primeira busca de uma combinação de filtros dispara coleta nas fontes e pode
        # passar de 60s quando concorre com a varredura inicial. Timeout curto aqui
        # devolveria 504 numa requisição que o backend ainda ia concluir.
        proxy_read_timeout 150s;
        # O currículo pode chegar perto do limite de 5 MB; deixa folga para o multipart.
        client_max_body_size 8m;
    }
}
